name: Terraform Infrastructure Deployment

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'terragrunt/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'terragrunt/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TERRAFORM_VERSION: '1.5.0'
  TERRAGRUNT_VERSION: '0.68.9'

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [development, staging]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          TG_VERSION="${{ env.TERRAGRUNT_VERSION }}"
          curl -sSL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt HCL Format Check
        id: fmt
        run: terragrunt hclfmt --check --diff terragrunt/
        continue-on-error: true

      - name: Authenticate to Google Cloud
        id: auth
        if: ${{ secrets.GCP_CREDENTIALS != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup gcloud CLI
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Terragrunt Init
        id: init
        if: steps.auth.outcome == 'success'
        run: |
          ENV_DIR="terragrunt/environments/${{ matrix.environment == 'development' && 'dev' || matrix.environment }}"
          cd "$ENV_DIR"
          terragrunt init --terragrunt-non-interactive
        continue-on-error: true

      - name: Terragrunt Validate
        id: validate
        if: steps.auth.outcome == 'success'
        run: |
          ENV_DIR="terragrunt/environments/${{ matrix.environment == 'development' && 'dev' || matrix.environment }}"
          cd "$ENV_DIR"
          terragrunt validate --terragrunt-non-interactive
        continue-on-error: true

      - name: Terragrunt Plan
        id: plan
        if: steps.auth.outcome == 'success'
        run: |
          ENV_DIR="terragrunt/environments/${{ matrix.environment == 'development' && 'dev' || matrix.environment }}"
          cd "$ENV_DIR"
          terragrunt plan \
            --terragrunt-non-interactive \
            -out="${{ github.workspace }}/tfplan-${{ matrix.environment }}" \
            -no-color 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const init     = '${{ steps.init.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const plan     = '${{ steps.plan.outcome }}';
            const authDone = '${{ steps.auth.outcome }}' === 'success';

            const planNote = authDone
              ? `\`${plan}\``
              : '`skipped` _(GCP credentials not available for this PR)_';

            const output = `#### Terraform Format and Style 🖌\`${fmt}\`
            #### Terragrunt Initialization ⚙️${authDone ? `\`${init}\`` : '`skipped`'}
            #### Terraform Validation 🤖${authDone ? `\`${validate}\`` : '`skipped`'}
            #### Terraform Plan 📖${planNote}

            *Environment:* \`${{ matrix.environment }}\`
            *Pusher:* @${{ github.actor }}
            *Action:* \`${{ github.event_name }}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Upload Plan Artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: tfplan-${{ matrix.environment }}
          retention-days: 5

  terraform-apply-dev:
    name: Apply to Development
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/reusable-terraform-deploy.yml
    with:
      environment: development
      env-dir: terragrunt/environments/dev
      plan-artifact-name: tfplan-development
      outputs-retention-days: 30
    secrets:
      gcp-credentials: ${{ secrets.GCP_CREDENTIALS }}

  terraform-apply-staging:
    name: Apply to Staging
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/reusable-terraform-deploy.yml
    with:
      environment: staging
      env-dir: terragrunt/environments/staging
      plan-artifact-name: tfplan-staging
      outputs-retention-days: 30
    secrets:
      gcp-credentials: ${{ secrets.GCP_CREDENTIALS_STAGING }}

  terraform-apply-production:
    name: Apply to Production
    needs: terraform-apply-staging
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    uses: ./.github/workflows/reusable-terraform-deploy.yml
    with:
      environment: production
      env-dir: terragrunt/environments/production
      plan-inline: true
      plan-artifact-name: tfplan-production
      outputs-retention-days: 90
    secrets:
      gcp-credentials: ${{ secrets.GCP_CREDENTIALS_PRODUCTION }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true
