name: Terragrunt Infrastructure

# Terragrunt wrapper for DRY multi-environment Terraform management.
# Plan runs on every PR touching infrastructure code.
# Apply runs automatically on main (dev/staging) and on manual dispatch (production).

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'terragrunt/**'
      - '.github/workflows/terragrunt.yml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'terragrunt/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      action:
        description: 'Terragrunt action to run'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TERRAFORM_VERSION: '1.5.0'
  TERRAGRUNT_VERSION: '0.55.0'

jobs:
  # ── Lint + validate ───────────────────────────────────────────────────────
  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Terraform format check
        run: |
          cd terraform
          terraform fmt -check -recursive
        continue-on-error: true

      - name: Terragrunt validate (${{ matrix.environment }})
        run: |
          cd terraform
          terragrunt validate \
            --terragrunt-tfpath terraform \
            --var-file=environments/${{ matrix.environment }}.tfvars \
            -no-color

  # ── Plan ──────────────────────────────────────────────────────────────────
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Terragrunt Init (${{ matrix.environment }})
        run: |
          cd terraform
          terragrunt init \
            --terragrunt-tfpath terraform \
            -backend-config=backend-${{ matrix.environment }}.tfbackend \
            -no-color

      - name: Terragrunt Plan (${{ matrix.environment }})
        id: plan
        run: |
          cd terraform
          terragrunt plan \
            --terragrunt-tfpath terraform \
            -var-file=environments/${{ matrix.environment }}.tfvars \
            -out=tfplan-${{ matrix.environment }} \
            -no-color 2>&1 | tee /tmp/plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan-output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;
            const icon = process.env.PLAN_EXIT === '0' ? '✅' : '⚠️';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terragrunt Plan — \`${{ matrix.environment }}\` ${icon}\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n</details>\n\n*Actor:* @${{ github.actor }}  |  *Ref:* \`${{ github.ref }}\``
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgplan-${{ matrix.environment }}
          path: terraform/tfplan-${{ matrix.environment }}
          retention-days: 5

  # ── Apply — dev / staging (auto on main) ─────────────────────────────────
  apply-nonprod:
    name: Apply (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      max-parallel: 1
      matrix:
        include:
          - environment: development
            credentials_secret: GCP_CREDENTIALS
          - environment: staging
            credentials_secret: GCP_CREDENTIALS_STAGING

    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[matrix.credentials_secret] }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tgplan-${{ matrix.environment }}
          path: terraform

      - name: Terragrunt Init (${{ matrix.environment }})
        run: |
          cd terraform
          terragrunt init \
            --terragrunt-tfpath terraform \
            -backend-config=backend-${{ matrix.environment }}.tfbackend \
            -no-color

      - name: Terragrunt Apply (${{ matrix.environment }})
        run: |
          cd terraform
          terragrunt apply -auto-approve tfplan-${{ matrix.environment }}

      - name: Capture outputs
        run: |
          cd terraform
          terragrunt output -json > outputs.json

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgoutputs-${{ matrix.environment }}
          path: terraform/outputs.json
          retention-days: 30

      - name: Write deployment summary
        run: |
          echo "## 🚀 Terragrunt deploy — \`${{ matrix.environment }}\` complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ matrix.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Outputs** | See \`tgoutputs-${{ matrix.environment }}\` artifact |" >> $GITHUB_STEP_SUMMARY

  # ── Apply — production (manual only) ─────────────────────────────────────
  apply-production:
    name: Apply (production)
    runs-on: ubuntu-latest
    needs: validate
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'production' &&
      github.event.inputs.action == 'apply'

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_PRODUCTION }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Terragrunt Init (production)
        run: |
          cd terraform
          terragrunt init \
            --terragrunt-tfpath terraform \
            -backend-config=backend-prod.tfbackend \
            -no-color

      - name: Terragrunt Plan (production)
        run: |
          cd terraform
          terragrunt plan \
            --terragrunt-tfpath terraform \
            -var-file=environments/production.tfvars \
            -out=tfplan-production \
            -no-color

      - name: Terragrunt Apply (production)
        run: |
          cd terraform
          terragrunt apply -auto-approve tfplan-production

      - name: Capture outputs
        run: |
          cd terraform
          terragrunt output -json > outputs.json

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgoutputs-production
          path: terraform/outputs.json
          retention-days: 90

      - name: Write deployment summary
        run: |
          echo "## 🚀 Terragrunt deploy — \`production\` complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`production\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Outputs** | See \`tgoutputs-production\` artifact |" >> $GITHUB_STEP_SUMMARY

  # ── Security scan ─────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy + Checkov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Checkov scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true
