name: Reusable Terragrunt Deploy

# Canonical Terragrunt apply workflow for one environment.
# Callers provide the environment name, Terragrunt env-dir, plan artifact name,
# and GCP credentials; this workflow handles the rest.
#
# Usage (apply from a previously uploaded plan artifact):
#   jobs:
#     apply-dev:
#       needs: terraform-plan
#       uses: ./.github/workflows/reusable-terraform-deploy.yml
#       with:
#         environment: development
#         env-dir: terragrunt/environments/dev
#         plan-artifact-name: tfplan-development
#         outputs-retention-days: 30
#       secrets:
#         gcp-credentials: ${{ secrets.GCP_CREDENTIALS }}
#
# Usage (inline plan + apply, e.g. production):
#   jobs:
#     apply-prod:
#       uses: ./.github/workflows/reusable-terraform-deploy.yml
#       with:
#         environment: production
#         env-dir: terragrunt/environments/production
#         plan-inline: true
#         plan-artifact-name: tfplan-production
#         outputs-retention-days: 90
#       secrets:
#         gcp-credentials: ${{ secrets.GCP_CREDENTIALS_PRODUCTION }}

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment name (development | staging | production)'
        required: true
        type: string
      terraform-version:
        description: 'Terraform version to install'
        type: string
        default: '1.5.0'
      terragrunt-version:
        description: 'Terragrunt version to install'
        type: string
        default: '0.68.9'
      env-dir:
        description: 'Path to the Terragrunt environment directory (e.g. terragrunt/environments/dev)'
        required: true
        type: string
      plan-inline:
        description: 'When true, run terragrunt plan locally before applying instead of downloading an artifact'
        type: boolean
        default: false
      plan-artifact-name:
        description: 'Name of the tfplan artifact to download (when plan-inline is false) or upload (when plan-inline is true)'
        required: true
        type: string
      upload-outputs:
        description: 'Upload terraform output as a JSON artifact'
        type: boolean
        default: true
      outputs-retention-days:
        description: 'Retention period in days for the outputs artifact'
        type: number
        default: 30
    secrets:
      gcp-credentials:
        description: 'GCP service account credentials JSON'
        required: true

jobs:
  terraform-apply:
    name: Terragrunt Apply – ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          TG_VERSION="${{ inputs.terragrunt-version }}"
          curl -sSL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.gcp-credentials }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Terragrunt Init
        run: |
          cd ${{ inputs.env-dir }}
          terragrunt init --terragrunt-non-interactive

      # -- Plan-inline path (e.g. production) -----------------------------------
      - name: Terragrunt Plan (inline)
        if: ${{ inputs.plan-inline }}
        run: |
          cd ${{ inputs.env-dir }}
          terragrunt plan \
            --terragrunt-non-interactive \
            -out="${{ github.workspace }}/${{ inputs.plan-artifact-name }}" \
            -no-color

      # -- Artifact path (dev / staging already planned upstream) ---------------
      - name: Download Plan Artifact
        if: ${{ !inputs.plan-inline }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plan-artifact-name }}
          path: ${{ github.workspace }}

      - name: Terragrunt Apply
        run: |
          cd ${{ inputs.env-dir }}
          terragrunt apply \
            --terragrunt-non-interactive \
            -auto-approve \
            "${{ github.workspace }}/${{ inputs.plan-artifact-name }}"

      - name: Terraform Output
        run: |
          cd ${{ inputs.env-dir }}
          terragrunt output -json > "${{ github.workspace }}/outputs.json"
          cat "${{ github.workspace }}/outputs.json"

      - name: Upload Terraform Outputs
        if: ${{ inputs.upload-outputs }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ inputs.environment }}
          path: ${{ github.workspace }}/outputs.json
          retention-days: ${{ inputs.outputs-retention-days }}

      - name: Write Deployment Summary
        run: |
          echo "## 🚀 Terragrunt deployment to \`${{ inputs.environment }}\` complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure Outputs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat "${{ github.workspace }}/outputs.json" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
